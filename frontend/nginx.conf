server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and stream to backend
    location /auth/ {
        proxy_pass http://backend:4000/auth/;
        proxy_http_version 1.1;
    }

    location /services {
        proxy_pass http://backend:4000/services;
        proxy_http_version 1.1;
    }

    location /metrics/ {
        proxy_pass http://backend:4000/metrics/;
        proxy_http_version 1.1;
    }

    location /rules {
        proxy_pass http://backend:4000/rules;
        proxy_http_version 1.1;
    }

    location /chaos {
        proxy_pass http://backend:4000/chaos;
        proxy_http_version 1.1;
    }

    location /stream {
        proxy_pass http://backend:4000/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

